# Server
server.port=8080

# NFR-01: HTTP compression — Tomcat compresses JS/CSS/JSON responses,
# reducing the React bundle from ~152 KB to ~49 KB over the wire.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# H2 file-based database — data persists across server restarts (US-10)
spring.datasource.url=jdbc:h2:file:./data/tododb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate — dialect auto-detected by Spring Boot (no need to specify explicitly)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console — available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
